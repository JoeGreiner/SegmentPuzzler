name: Linux build

on:
  workflow_call:

permissions:
  contents: read

env:
  CI_ROOT: /tmp/spci
  BUILD_PARALLEL: '4'

jobs:
  build:
    name: Linux x86_64 AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build AlmaLinux 8 environment
        run: |
          mkdir -p "$CI_ROOT/logs"
          bash scripts/linux/run.sh image 2>&1 | tee "$CI_ROOT/logs/container.log"

      - name: Record toolchain
        id: toolchain
        run: |
          mkdir -p "$CI_ROOT/logs"
          bash scripts/linux/run.sh toolchain | tee "$CI_ROOT/logs/toolchain.log"
          echo "key=$(sha256sum "$CI_ROOT/logs/native-toolchain.log" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore AppImage runtime
        id: runtime-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/spci/runtime
          key: appimage-runtime-x64-${{ hashFiles('scripts/linux/tools.json', 'scripts/linux/build-runtime.sh', 'scripts/linux/runtime-appimagelauncher.patch') }}

      - name: Build compatible AppImage runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: bash scripts/linux/build-runtime.sh

      - name: Save AppImage runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/spci/runtime
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}

      - name: Restore Qt
        id: qt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/spci/qt
          key: alma8-x64-qt-${{ hashFiles('scripts/ci/dependencies.json', 'scripts/linux/Dockerfile', 'scripts/linux/run.sh') }}

      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: bash scripts/linux/run.sh qt

      - name: Save Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/spci/qt
          key: ${{ steps.qt-cache.outputs.cache-primary-key }}

      - name: Restore ITK
        id: itk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/spci/install/itk
          key: alma8-x64-itk-${{ steps.toolchain.outputs.key }}-${{ hashFiles('scripts/ci/dependencies.json', 'scripts/ci/build-dependency.sh', 'scripts/linux/Dockerfile', 'scripts/linux/run.sh') }}

      - name: Build ITK
        if: steps.itk-cache.outputs.cache-hit != 'true'
        run: bash scripts/linux/run.sh itk

      - name: Save ITK
        if: steps.itk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/spci/install/itk
          key: ${{ steps.itk-cache.outputs.cache-primary-key }}

      - name: Restore VTK
        id: vtk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/spci/install/vtk
          key: alma8-x64-vtk-${{ steps.toolchain.outputs.key }}-${{ hashFiles('scripts/ci/dependencies.json', 'scripts/ci/build-dependency.sh', 'scripts/linux/Dockerfile', 'scripts/linux/run.sh') }}

      - name: Build VTK
        if: steps.vtk-cache.outputs.cache-hit != 'true'
        run: bash scripts/linux/run.sh vtk

      - name: Save VTK
        if: steps.vtk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/spci/install/vtk
          key: ${{ steps.vtk-cache.outputs.cache-primary-key }}

      - name: Build SegmentPuzzler
        run: bash scripts/linux/run.sh app

      - name: Package AppImage
        id: package
        run: bash scripts/linux/run.sh package

      - name: Check packaged application on AlmaLinux 8
        run: bash scripts/linux/run.sh check-package

      - name: Check runtime mounting on Ubuntu
        run: |
          test -x /usr/bin/fusermount3
          test -c /dev/fuse
          probe="$CI_ROOT/runtime-tests/runtime probe.AppImage"
          for mode in direct legacy target; do
            case "$mode" in
              direct) command=("$probe") ;;
              legacy) command=("$CI_ROOT/build/appimagelauncher-test/binfmt-bypass" "$probe") ;;
              target) command=(env "TARGET_APPIMAGE=$probe" "$CI_ROOT/runtime/runtime-x86_64") ;;
            esac
            log="$CI_ROOT/logs/runtime-mount-$mode.log"
            set +e
            env -i PATH=/usr/bin:/bin FUSERMOUNT_PROG=/usr/bin/fusermount3 \
              timeout 30 "${command[@]}" 'argument with spaces' '--literal=*' > "$log" 2>&1
            result=$?
            set -e
            cat "$log"
            [[ "$result" = 37 ]]
            grep -Fxq 'Runtime probe passed' "$log"
          done

      - name: Upload AppImage
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-linux-x86_64
          overwrite: true
          path: /tmp/spci/packages/*.AppImage
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-linux-x86_64
          overwrite: true
          path: |
            /tmp/spci/logs/
            /tmp/spci/build/**/CMakeCache.txt
            /tmp/spci/build/**/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7
