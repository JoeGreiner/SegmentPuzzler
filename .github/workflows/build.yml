name: Build packages

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        default: all
        options: [all, windows, macos, linux]
      release_tag:
        description: 'Existing tag to rebuild and prepare a release draft (all platforms; leave empty for build only)'
        type: string
        default: ''
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}-${{ inputs.release_tag && 'all' || inputs.platform || 'all' }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && inputs.release_tag == '' }}

jobs:
  version:
    name: Check version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_commit: ${{ steps.version.outputs.source_commit }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read project version and check tag
        id: version
        shell: bash
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          tag=$REQUESTED_RELEASE_TAG
          source_commit=
          if [[ -n "$tag" ]]; then
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected an existing vX.Y.Z tag' >&2; exit 1; }
            git fetch --no-tags --depth=1 origin "refs/tags/$tag"
            source_commit=$(git rev-parse 'FETCH_HEAD^{commit}')
            version=$(git show "$source_commit:CMakeLists.txt" | sed -nE 's/^project\(.*VERSION ([0-9.]+)\).*/\1/p')
          else
            version=$(sed -nE 's/^project\(.*VERSION ([0-9.]+)\).*/\1/p' CMakeLists.txt)
            if [[ "$GITHUB_REF_TYPE" = tag ]]; then tag=$GITHUB_REF_NAME; fi
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid project version' >&2; exit 1; }
          if [[ -n "$tag" && "$tag" != "v$version" ]]; then
            echo "Tag $tag does not match project version v$version" >&2
            exit 1
          fi
          printf 'version=%s\nsource_commit=%s\nrelease_tag=%s\n' \
            "$version" "$source_commit" "$tag" >> "$GITHUB_OUTPUT"
          printf 'Application commit: %s\n\nBuild scripts commit: %s\n' \
            "${source_commit:-$GITHUB_SHA}" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  windows:
    needs: version
    if: github.event_name == 'push' || inputs.release_tag != '' || inputs.platform == 'all' || inputs.platform == 'windows'
    uses: ./.github/workflows/windows.yml
    with:
      source_commit: ${{ needs.version.outputs.source_commit }}

  macos:
    needs: version
    if: github.event_name == 'push' || inputs.release_tag != '' || inputs.platform == 'all' || inputs.platform == 'macos'
    uses: ./.github/workflows/macos.yml
    with:
      source_commit: ${{ needs.version.outputs.source_commit }}

  linux:
    needs: version
    if: github.event_name == 'push' || inputs.release_tag != '' || inputs.platform == 'all' || inputs.platform == 'linux'
    uses: ./.github/workflows/linux.yml
    with:
      source_commit: ${{ needs.version.outputs.source_commit }}

  release:
    name: Prepare release draft
    needs: [version, windows, macos, linux]
    if: (github.event_name == 'push' && github.ref_type == 'tag') || inputs.release_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
      SOURCE_COMMIT: ${{ needs.version.outputs.source_commit || github.sha }}
    steps:
      - name: Check release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.version.outputs.release_tag }}

      - name: Download packages and prepare draft
        shell: bash
        run: |
          [[ "$(git rev-parse HEAD)" = "$SOURCE_COMMIT" ]] || { echo 'Release tag changed during the build' >&2; exit 1; }
          gh run download "$GITHUB_RUN_ID" --pattern 'packages-*' --dir packages
          files=(
            "packages/packages-windows-x64/SegmentPuzzler-$VERSION-windows-x64-installer.exe"
            "packages/packages-windows-x64/SegmentPuzzler-$VERSION-windows-x64-portable.zip"
            "packages/packages-macos-arm64/SegmentPuzzler-$VERSION-macos-arm64.dmg"
            "packages/packages-linux-x86_64/SegmentPuzzler-$VERSION-linux-x86_64.AppImage"
            "packages/packages-linux-x86_64-legacy/SegmentPuzzler-$VERSION-linux-x86_64-legacy.AppImage"
          )
          for file in "${files[@]}"; do test -s "$file"; done
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            [[ "$draft" = true ]] || { echo 'Release is already published' >&2; exit 1; }
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --draft --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
