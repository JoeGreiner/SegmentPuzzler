name: macOS build

on:
  workflow_call:

permissions:
  contents: read

env:
  CI_ROOT: /Users/runner/spci
  MACOSX_DEPLOYMENT_TARGET: '15.0'
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  BUILD_PARALLEL: '3'
  SEGMENT_PUZZLER_USE_ICON_COMPOSER: 'OFF'
  HOMEBREW_NO_AUTO_UPDATE: '1'

jobs:
  build:
    name: macOS Apple Silicon DMG
    runs-on: macos-15
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up build tools
        id: toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          brew list libomp >/dev/null 2>&1 || brew install libomp
          echo "OpenMP_ROOT=$(brew --prefix libomp)" >> "$GITHUB_ENV"
          echo "qt=$(jq -r '.qt.version' scripts/ci/dependencies.json)" >> "$GITHUB_OUTPUT"
          key=$( { clang --version; cmake --version; xcodebuild -version; brew list --versions libomp; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Install Qt
        id: qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: ${{ steps.toolchain.outputs.qt }}
          arch: clang_64
          modules: qtimageformats
          dir: /Users/runner/Qt
          cache: true

      - name: Set Qt prefix
        env:
          QT_PREFIX: ${{ steps.qt.outputs.qt-root-dir }}
        run: echo "QT_ROOT_DIR=$QT_PREFIX" >> "$GITHUB_ENV"

      - name: Remove obsolete AGL dependency from Qt
        run: |
          # Qt 6.8.3 still adds AGL, which is absent from the macOS 26 SDK.
          module="$QT_ROOT_DIR/lib/cmake/Qt6/FindWrapOpenGL.cmake"
          sed -i '' '/target_link_libraries.*__opengl_agl_fw_path/d' "$module"

      - name: Restore ITK
        id: itk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /Users/runner/spci/install/itk
          key: macos15-arm64-itk-${{ steps.toolchain.outputs.key }}-${{ hashFiles('scripts/ci/dependencies.json', 'scripts/ci/build-dependency.sh') }}

      - name: Build ITK
        if: steps.itk-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci/build-dependency.sh itk

      - name: Save ITK
        if: steps.itk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /Users/runner/spci/install/itk
          key: ${{ steps.itk-cache.outputs.cache-primary-key }}

      - name: Restore VTK
        id: vtk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /Users/runner/spci/install/vtk
          key: macos15-arm64-vtk-${{ steps.toolchain.outputs.key }}-${{ hashFiles('scripts/ci/dependencies.json', 'scripts/ci/build-dependency.sh') }}-no-agl

      - name: Build VTK
        if: steps.vtk-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci/build-dependency.sh vtk

      - name: Save VTK
        if: steps.vtk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /Users/runner/spci/install/vtk
          key: ${{ steps.vtk-cache.outputs.cache-primary-key }}

      - name: Build SegmentPuzzler
        run: bash scripts/ci/build-app.sh

      - name: Package DMG
        id: package
        run: bash scripts/macos/package.sh

      - name: Check packaged application
        run: bash scripts/macos/check-package.sh

      - name: Upload DMG
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-macos-arm64
          overwrite: true
          path: /Users/runner/spci/packages/*.dmg
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-macos-arm64
          overwrite: true
          path: |
            /Users/runner/spci/logs/
            /Users/runner/spci/build/**/CMakeCache.txt
            /Users/runner/spci/build/**/CMakeConfigureLog.yaml
            /Users/runner/spci/packages/_CPack_Packages/Darwin/DragNDrop/*.log
          if-no-files-found: ignore
          retention-days: 7
